# Комплектация памяти коуча — Loreground 0.15.1.
# Всё, что меняет поведение проверки, живёт здесь, а не в памяти того,
# кто набирал команду.

validate:
  knowledge_types: [наблюдение]   # доменный тип-специализация знания
  trust_layer: true               # слой доверия ПОСТАВЛЕН: каждое наблюдение
                                  # про человека обязано нести источник
  command: >
    python3 /plugin/standard/validate.py память --knowledge-type наблюдение

# ── Паспорт состояния ────────────────────────────────────────────────────────
# Скрипта пересборки нет: реальность коуч узнаёт из разговора и из прогона
# инструментов, а не опросом. Значит mode: manual — один дом, дата у факта,
# перезапись на месте.
state:
  mode: manual
  source: >
    слова человека в разговоре + прогон инструментов (Todoist, Календарь).
    Сперва команда в реальность, потом запись — записывается результат
    проверки, а не память о нём.
  consumers:
    - what: выжимки дней, недель и месяцев в архиве
      rebuilt_by: ночной прогон бота (src/digest.py)
    - what: список выжимок в память/00-index.md между метками
      rebuilt_by: тот же ночной прогон, Digester.rotate()
    - what: ритмы — расписание чек-инов и ночной работы
      rebuilt_by: коуч в разговоре; бот перечитывает файл сразу после ответа
    - what: снимок всех задач Todoist с описаниями и комментариями
      rebuilt_by: ночной прогон бота, src/todoist_snapshot.py — в базу, не в файлы
    - what: колесо баланса и цифры на дашборде
      rebuilt_by: сборщик src/dashboard.py читает журнал/колесо-баланса.md

# ── Паспорт стартовой загрузки ───────────────────────────────────────────────
#
# Паспорт считает в ТОКЕНАХ: байт — верная единица для кода, но платит человек
# токенами, а курс у русского markdown свой (около 4,2 Б на токен).
#
# Главное, ради чего он существует: байты полезной нагрузки и байты, доехавшие
# до контекста, — РАЗНЫЕ величины. Описания 18 кнопок Todoist весят 20 КБ,
# а стоят 241 токен: движок кладёт в контекст имена, а описание подтягивает
# в момент вызова.
#
# ⚠️ Числа ниже — с эталонной установки. Ваши разойдутся: длина конституции
# зависит от личной надстройки, а размер куска памяти — от того, насколько
# разговорчивый у вас день. Бот скажет вслух, если разойдётся сильно; тогда
# пересчитайте строку и запишите свою, а не гасите сторожа.
startup:
  # Потолок на каждый режим. Один общий бессмыслен: годовая стратсессия обязана
  # быть дороже утреннего «что сегодня» вдвое, и общий потолок либо промолчит
  # про раздутый рабочий режим, либо будет кричать на каждую стратсессию.
  budgets:
    фоновый: 10000
    рабочий: 52000
    полный: 60000
    годовой: 70000

  # Построчная сверка в БАЙТАХ осталась: токенов по строкам модель не разбивает,
  # а именно построчная сверка ловит враньё вида «объявлено 69 400, на деле
  # 37 962». Сверяются только строки, размер которых от режима не зависит.
  loads:
    - what: конституция коуча — части под режим
      by: hook                    # склеивает код бота и отдаёт системным промптом
      path: /plugin/prompts/конституция/
      tokens: 7105
      why: >
        без неё коуч перестаёт быть коучем и становится ассистентом Todoist.
        Части грузятся по составу режима: полному и годовому едет ещё
        «стратегия», фоновому не едет ничего

    - what: встроенные инструменты движка (Read, Write, Bash…)
      by: env                     # кладёт движок; гасится рычагом режима
      tokens: 17444
      why: >
        самая большая строка рюкзака. Это рычаг, а не пол: с `tools=[]` запрос
        стоит 146 токенов. Фоновым прогонам инструменты не нужны — они думают
        над текстом, а не лазят по файлам

    - what: правила работы с памятью и навыки плагина
      by: env                     # движок читает правила проекта (setting_sources)
      tokens: 4118
      why: без них запись идёт мимо модулей и без провенанса

    - what: выжимка — средний размер одного куска памяти
      by: hook                    # подкладывает код бота в первый запрос новой сессии
      path: /archive/coach.db     # таблица digests, число кусков задаёт режим
      bytes: 4218
      tokens: 1016
      why: >
        разговор начинается заново каждую ночь; без выжимок коуч просыпается
        с чистой головой и заставляет пересказывать вчерашнее. Сверяется
        РАЗМЕР КУСКА, а не сумма окна: сумма растёт сама, пока база
        наполняется, а размер куска — не растёт. Поехал он — значит выжимки
        стали многословнее, и чинить надо промпт выжимки

    - what: файлы стратегии — подкладывает код в первый запрос
      by: hook                    # состав задаёт режим (modes.ФАЙЛЫ)
      tokens: 1819
      why: >
        объявленное обязательным обязано грузиться кодом. Просьба в конституции
        «прочитай в начале разговора» по десяти сессиям сработала в одной

    - what: описания кнопок инструментов
      by: hook                    # кладёт движок, меряет код бота (engine.tools_weight)
      bytes: 21799
      tokens: 241
      why: >
        строка объявляет полезную нагрузку, а не цену, и разница здесь
        в восемьдесят раз. Тумблеры кнопок экономят ВНИМАНИЕ модели,
        а не место, и рычагом режимов работать не могут

    - what: ночной обход дел — свод к утреннему чек-ину
      by: hook                    # считает src/detectors.py перед утренним пингом
      path: /app/src/detectors.py # дом факта — Todoist и снимки; это их отражение
      # Числа `bytes` здесь нет намеренно, и это не пропуск. Размер свода
      # зависит не от кода, а от того, сколько дел сегодня отклонилось:
      # один завал — пара строк, десять — экран. Замер 01.08 дал 1168 Б,
      # и следующие ночи честно приносили 173 Б и 2069 Б — то есть сторож
      # ругался на исправную работу и заводил задачу человеку каждый раз.
      # Сторож, который кричит каждый день, приучает себя не читать.
      # Цену этой строки охраняет потолок режима, в токенах: она в него входит.
      tokens: 281                 # замер 01.08.2026, справочно
      why: >
        коуч перестаёт ждать вопроса и сам называет то, чего человек не видит.
        Уезжает в контекст один раз в сутки, с утренним чек-ином

    - what: сводка дел — агрегат Todoist к каждой реплике
      by: hook                    # собирает src/agenda.py перед каждым ответом
      path: /app/src/agenda.py    # дом факта — Todoist; это его отражение
      bytes: 353
      tokens: 85
      why: >
        коуч обязан знать картину дня всегда, а не когда вспомнит сходить
        в Todoist; дамп задач неприемлем — это сотни тысяч токенов
